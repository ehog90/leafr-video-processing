services:
  leafr-image-capture-convert:
    build: .
    ports:
      - "8080:8080"
    # Only the explicitly listed host devices are exposed to the container.
    devices:
      # V4L2 opens the device read-write; ":r" alone makes the kernel return EPERM.
      - "/dev/video0:/dev/video0:rwm"
    group_add:
      - "${VIDEO_GID:-44}" # host "video" group id (getent group video)
    environment:
      ALLOWED_DEVICES: /dev/video0
    volumes:
      # Must be writable by the container user (uid 10001). On Linux hosts run once:
      #   mkdir -p data/images && sudo chown -R 10001:10001 data/images
      - ./data/images:/data/images
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
